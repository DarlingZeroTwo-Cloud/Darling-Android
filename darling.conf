# Darling Android 配置文件
# 版本: 0.1.0

# 安装目录
DARLING_ANDROID_DIR="/opt/darling-android"

# Android 版本
ANDROID_VERSION="13"

# CPU 架构
ANDROID_ARCH="x86_64"

# ARM 转译
ARM_TRANSLATION="auto"  # auto / libhoudini / libndk / none

# GPU 加速
GPU_ACCELERATION="auto"  # auto / virgl / llvmpipe / none

# 窗口模式
WINDOW_MODE="wayland"  # wayland / x11

# 日志级别
LOG_LEVEL="info"  # debug / info / warn / error
